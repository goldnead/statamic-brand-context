<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #1E293B 0%, #111C2E 55%, #070C14 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #CBD5E1; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #94A3B8; box-shadow: 0 0 18px #94A3B8; }
  h1 { font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#7DD3FC,#C4B5FD); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #CBD5E1; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #E2E8F0; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(148,163,184,.28), transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Brand Context</span></h1>
      <p class="sub">Several brands in one Statamic install &mdash; hard isolation behind a flag, single-brand and invisible until you turn it on.</p>
      <div class="badges">
        <span class="badge">Multi-brand</span>
        <span class="badge">Isolation</span>
        <span class="badge">Switcher</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#94A3B8"/><stop offset="1" stop-color="#475569"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#020617" flood-opacity="0.32"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- a stack of brands, the active one in front -->
        <g filter="url(#sh)">
          <rect x="164" y="112" width="244" height="112" rx="30" fill="#FFFFFF" opacity="0.3"/>
          <rect x="132" y="158" width="268" height="122" rx="32" fill="#FFFFFF" opacity="0.55"/>
          <rect x="100" y="212" width="300" height="152" rx="34" fill="#FFFFFF"/>
        </g>
        <!-- the brands you switch between -->
        <circle cx="170" cy="288" r="28" fill="#38BDF8"/>
        <circle cx="250" cy="288" r="28" fill="#A78BFA"/>
        <circle cx="330" cy="288" r="28" fill="#FBBF24"/>
      </svg>
    </div>
  </div>
</body>
</html>
